<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartLink - صفحة خاصة</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a0006, #4d0011, #80001c);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      padding: 20px 10px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 77, 109, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.5s ease;
    }
    h1 {
      font-size: 26px;
      color: #ff4d6d;
      margin-top: 0;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }
    p.subtitle {
      font-size: 14px;
      color: #e0e0e0;
      margin-bottom: 25px;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      outline: none;
      text-align: center;
      font-size: 16px;
      transition: 0.3s;
    }
    input[type="password"]:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }
    button.btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff4d6d, #ff758f);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
      transition: 0.3s;
    }
    button.btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
    }
    .secret-content {
      display: none;
      animation: fadeIn 1s ease forwards;
    }
    .greeting-title {
      font-size: 20px;
      color: #ff758f;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .message-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 15px;
      padding: 18px;
      font-size: 15px;
      line-height: 1.7;
      color: #fff;
      text-align: right;
      border-right: 4px solid #ff4d6d;
      margin-bottom: 20px;
    }
    .reasons-title {
      font-size: 18px;
      color: #ff758f;
      margin: 20px 0 10px;
    }
    .reason-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 77, 109, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gift-btn {
      background: linear-gradient(90deg, #ff0055, #ff5050);
      margin-top: 15px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeIn 0.4s forwards;
    }
    .heart-box {
      position: relative;
      width: 220px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: heartBeat 1.2s infinite ease-in-out;
    }
    .heart-shape {
      position: absolute;
      width: 160px;
      height: 160px;
      background: #ffffff;
      transform: rotate(-45deg);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 77, 109, 0.5);
    }
    .heart-shape::before,
    .heart-shape::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      background: #ffffff;
      border-radius: 50%;
    }
    .heart-shape::before {
      top: -80px;
      left: 0;
    }
    .heart-shape::after {
      left: 80px;
      top: 0;
    }
    .heart-text {
      position: relative;
      z-index: 10;
      color: #e60000;
      font-size: 38px;
      font-weight: 900;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      margin-top: -15px;
    }
    .close-modal-btn {
      margin-top: 30px;
      padding: 10px 25px;
      border-radius: 20px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <div class="card" id="lockCard">
      <h1>رساله لمجنونتى ❤️</h1>
      <p class="subtitle">جاهزة يروحي ✨</p>

      <div class="input-group">
        <input type="password" id="passInput" placeholder="اكتبي الباسورد ي❤">
      </div>
      <button class="btn-primary" onclick="unlockPage()">دوسي هنا لفتح قلبي ←</button>
    </div>

    <div class="card secret-content" id="secretCard">
      <div class="greeting-title">كل سنة وأنتِ حظي الحلو واحلى حاجه حصلتلي 🥰</div>
      
      <div class="message-box">
        وجودك بقربي هو أجمل هدية قدمتها لي الحياة... "بين كل الناس، قلبي اختارك أنتِ ربنا ما يفرقنا بحبك اوى ويارب ما تزعلي مني ابدا ولا تكرهيني"
      </div>

      <div class="reasons-title">ليه بحبك؟ ❤️</div>
      <div class="reason-card">
        <span>💖</span>
        <span>ضحكتك بتهون عليا كل حاجة</span>
      </div>
      <div class="reason-card">
        <span>💖</span>
        <span>اعيش واسمع ضحكتك وصوتك الجميل</span>
      </div>

      <button class="btn-primary gift-btn" onclick="openGift()">اضغطي هنا لاستلام هديتك 🎁</button>
    </div>
  </div>

  <div class="modal-overlay" id="giftModal">
    <div class="heart-box">
      <div class="heart-shape"></div>
      <div class="heart-text">بحبك</div>
    </div>
    <button class="close-modal-btn" onclick="closeGift()">إغلاق ❤️</button>
  </div>

  <script>
    const SECRET_PASS = "2010";

    function unlockPage() {
      const input = document.getElementById('passInput').value;
      if (input === SECRET_PASS) {
        document.getElementById('lockCard').style.display = 'none';
        document.getElementById('secretCard').style.display = 'block';
        launchConfetti();
      } else {
        alert("الباسورد مش صح! جربي تاني ❤️");
      }
    }

    function openGift() {
      document.getElementById('giftModal').style.display = 'flex';
      launchConfetti();
    }

    function closeGift() {
      document.getElementById('giftModal').style.display = 'none';
    }

    function launchConfetti() {
      if (window.confetti) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#ff4d6d', '#ffffff', '#ff758f', '#ff0055']
        });
      }
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let hearts = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Heart {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + 20;
        this.size = Math.random() * 12 + 8;
        this.speed = Math.random() * 1.5 + 0.8;
        this.opacity = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.y -= this.speed;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ff4d6d';
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(this.x, this.y + topCurveHeight);
        ctx.bezierCurveTo(
          this.x, this.y, 
          this.x - this.size / 2, this.y, 
          this.x - this.size / 2, this.y + topCurveHeight
        );
        ctx.bezierCurveTo(
          this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, 
          this.x, this.y + this.size, 
          this.x, this.y + this.size
        );
        ctx.bezierCurveTo(
          this.x, this.y + this.size, 
          this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2, 
          this.x + this.size / 2, this.y + topCurveHeight
        );
        ctx.bezierCurveTo(
          this.x + this.size / 2, this.y, 
          this.x, this.y, 
          this.x, this.y + topCurveHeight
        );
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 25; i++) {
      hearts.push(new Heart());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      hearts.forEach(h => {
        h.update();
        h.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
